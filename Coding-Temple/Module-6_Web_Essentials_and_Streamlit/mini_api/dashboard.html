<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Manager</title>
        <style>
            body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
            .task { display: flex; justify-content: space-between; align-items: center;
                    padding: 12px; margin: 8px 0; background: #f8f8f8; border-radius: 6px; }
            .task.done { text-decoration: line-through; opacity: 0.6; }
            .add-form { display: flex; gap: 8px; margin: 20px 0; }
            .add-form input { flex: 1; padding: 10px; font-size: 1rem; }
            button { padding: 8px 16px; cursor: pointer; }
            .error { color: #e74c3c; }
            .stats { display: flex; gap: 20px; margin: 16px 0; }
            .stat { background: #e8f4fd; padding: 12px 20px; border-radius: 6px; text-align: center; }
            .stat .number { font-size: 1.5rem; font-weight: bold; color: #1a1a2e; }
        </style>
    </head>
    <body>
        <div class="stats" id="stats"></div>
        <div id="task-list"></div>
        <div class="add-form">
            <input type="text" id="new-task" placeholder="Add a new task...">
            <button id="add-btn">Add</button>
        </div>
        <p class="time"></p>
        <button id="refresh-btn">Refresh</button>
        <p id="error" class="error"></p>

        <script>
            const API = "http://localhost:8000"; 

            const taskList = document.querySelector('#task-list');
            const stats = document.querySelector('#stats');
            const addBtn = document.querySelector('#add-btn');
            const refreshBtn = document.querySelector('#refresh-btn');
            const newTaskInput = document.querySelector('#new-task');
            const error = document.querySelector('#error');
            const time = document.querySelector('.time');

            // Load stats
            async function loadStats() {
                try {
                    const response = await fetch(`${API}/stats`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();

                    stats.innerHTML = `
                        <div class="stat"><div class="number">${data.total}</div>Total</div>
                        <div class="stat"><div class="number">${data.done}</div>Done</div>
                        <div class="stat"><div class="number">${data.pending}</div>Pending</div>
                    `;
                } catch (err) {
                    stats.innerHTML = `<p class="error">Could not load stats</p>`;
                }
            }

            // Load task list
            async function loadTasks() {
                try {
                    error.textContent = "";  
                    const response = await fetch(`${API}/tasks`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const tasks = await response.json();

                    taskList.innerHTML = tasks.map(task => `
                        <div class="task ${task.done ? 'done' : ''}">
                            <span>${task.title}</span>
                            <button class="toggle-btn" data-id="${task.id}">
                                ${task.done ? 'Undo' : 'Complete'}
                            </button>
                        </div>
                    `).join("");
                } catch (err) {
                    error.textContent = "Could not load tasks. Is the API running?";
                }
            }

            // Add new task
            async function addTask() {
                const title = newTaskInput.value.trim();
                if (!title) return; 

                try {
                    const response = await fetch(`${API}/tasks`, {
                        method: "POST", 
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ title })
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    newTaskInput.value = ""; 
                    await refreshAll();
                } catch (err) {
                    error.textContent = "Failed to add task";
                }
            }

            // Toggle task completion
            async function toggleTask(id) {
                try {
                    const response = await fetch(`${API}/tasks/${id}`, {
                        method: "PATCH"
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    await refreshAll();
                } catch (err) {
                    error.textContent = "Failed to update task";
                }
            }

            // Centralized refresh function
            async function refreshAll() {
                await Promise.all([loadStats(), loadTasks()]);
                time.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
            }

            // Event Listeners
            addBtn.addEventListener("click", addTask);
            
            newTaskInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") addTask();
            });

            // Refresh button re-fetches data
            refreshBtn.addEventListener("click", refreshAll);

            // Event delegation for dynamic Complete/Undo buttons attached to taskList
            taskList.addEventListener("click", (e) => {
                if (e.target.classList.contains("toggle-btn")) {
                    const id = e.target.getAttribute("data-id");
                    toggleTask(id);
                }
            });

            // Initial load on page ready
            refreshAll();
        </script>
    </body>
</html>
