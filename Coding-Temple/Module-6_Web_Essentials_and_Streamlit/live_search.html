<!-- When the page loads, fetch all users from https://jsonplaceholder.typicode.com/users (this returns 10 user objects)
Display all users as cards showing: name, email, company name (found in user.company.name)
Add a search input at the top of the page
As the user types in the search box, filter the displayed cards in real time - matching against both name and email (case-insensitive)
Show a result count below the search box: "Showing 3 of 10 users"
Handle the loading state: show "Loading users..." while the fetch is in progress
Handle errors: show an error message if the fetch fails


Deliverable: A working live_search.html file that loads user data, displays it as cards, and filters live as the user types. -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Live Search</title>
        <style>
            body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; align-items: center;}
             button { padding: 2px; font-size: 1rem; cursor: pointer; margin-right: 8px; align-items: center;}
             input{
                padding: 3px;
             }
        </style>
    </head>
    <body>
        <h1>Users Search</h1>
        <input placeholder="Search a user's name"></input>
        <p id="content"></p>
        <p id="result"></p>
        <script>
            const content = document.querySelector("#content")
            const result = document.querySelector('#result')
            const searchInput = document.querySelector('input')
            let allUsers = []
            async function loadUser(id) {
                // Show loading state
                content.textContent = `Loading users...`;
                try{
                    const response = await fetch(`https://jsonplaceholder.typicode.com/users`);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                     const users = await response.json();
                    allUsers = users

                     content.innerHTML = allUsers.map(user => `
                            <div class="card">
                                <h3>${user.name}</h3>
                                <p>${user.email}</p>
                                <p>${user.company.name}</p>
                            </div>
                        `).join("");
                    } catch(error){
                    content.innerHTML = `<p class="error">Failed to load: ${error.message}</p>`;
                    result.textContent ="Error occurred";
                }finally{
                    console.log(`Fetch attempy for user ${id} complete.`)
                }
            }
            function filterUsers() {
                    const term = searchInput.value.toLowerCase();
                    const filtered = allUsers.filter(user => 
                        // what two things should you check here?
                        user.name.toLowerCase().includes(term) || user.email.toLowerCase().includes(term)
                    );
                        content.innerHTML = filtered.map(user => `
                            <div class="card">
                                <h3>${user.name}</h3>
                                <p>${user.email}</p>
                                <p>${user.company.name}</p>
                            </div>
                        `).join("");
                    result.textContent=`Showing ${filtered.length} of ${allUsers.length} Users`

                }

                            
            searchInput.addEventListener("input", () =>{
                filterUsers()
            })

            loadUser(1)

        </script>
    </body>
</html>
