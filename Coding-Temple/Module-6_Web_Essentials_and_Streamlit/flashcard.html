<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Flashcards</title>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --focus-ring: #ffbf47;
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        main {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 360px;
        }

        /* Visible focus state for keyboard accessibility */
        button:focus-visible,
        .card:focus-visible {
            outline: 3px solid var(--focus-ring);
            outline-offset: 3px;
        }

        .card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.2rem 0;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: #fafafa;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .card:hover {
            border-color: var(--primary-color);
        }

        .question {
            margin: 0 0 1rem 0;
            font-size: 1.1rem;
        }

        .answer {
            margin: 0;
            color: var(--primary-color);
            font-weight: bold;
            display: none; /* Hidden by default */
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 1rem;
        }

        button {
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .progress {
            margin: 0 0 1rem 0;
            font-size: 0.85rem;
            color: #666;
        }

        /* Keyboard shortcuts helper legend */
        .keyboard-legend {
            font-size: 0.75rem;
            color: #777;
            border-top: 1px solid #eee;
            padding-top: 0.8rem;
            text-align: left;
            line-height: 1.4;
        }

        .keyboard-legend kbd {
            background-color: #eee;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 1px 4px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #333;
        }
    </style>
</head>
<body>
    <main>
        <section id="flashcard-app">
            <h2>Flashcards</h2>
            
            <!-- Focusable card container (tabindex="0") with ARIA roles for screen readers -->
            <div class="card" id="card-container" tabindex="0" role="button" aria-expanded="false" aria-label="Flashcard. Click or press Space to reveal answer.">
                <h4 class="question" id="card-question"></h4>
                <p class="answer" id="card-answer"></p>
            </div>

            <div class="button-group">
                <button id="prev-btn" aria-label="Previous card">Prev</button>
                <button id="show-answer-btn" aria-label="Toggle answer">Show Answer</button>
                <button id="next-btn" aria-label="Next card">Next</button>
            </div>

            <p class="progress" id="progress-text" aria-live="polite"></p>

            <!-- Keyboard Navigation Guide -->
            <div class="keyboard-legend">
                <strong>Keyboard Shortcuts:</strong><br>
                <kbd>→</kbd> Next | <kbd>←</kbd> Prev | <kbd>Space</kbd> Flip | <kbd>Home</kbd> First | <kbd>End</kbd> Last
            </div>
        </section>
    </main>

    <script>
        // 1. Data Store: JS Array of Q&A Pairs
        const cards = [
            { q: "What does HTTP stand for?", a: "HyperText Transfer Protocol" },
            { q: "What status code means ‘Not Found’?", a: "404" },
            { q: "What does CSS stand for?", a: "Cascading Style Sheets" },
            { q: "What does DOM stand for?", a: "Document Object Model" },
            { q: "What Python library do we use for HTTP requests?", a: "requests" }
        ];

        let currentIndex = 0;

        // DOM Element references
        const questionEl = document.getElementById("card-question");
        const answerEl = document.getElementById("card-answer");
        const progressEl = document.getElementById("progress-text");
        const cardContainer = document.getElementById("card-container");
        const showAnswerBtn = document.getElementById("show-answer-btn");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");

        // Central update function
        function updateDisplay() {
            const currentCard = cards[currentIndex];
            questionEl.textContent = currentCard.q;
            answerEl.textContent = currentCard.a;
            
            // Hide answer on navigation reset
            answerEl.style.display = "none";
            cardContainer.setAttribute("aria-expanded", "false");

            // Update progress indicator
            progressEl.textContent = `Card ${currentIndex + 1} of ${cards.length}`;
        }

        // Toggle answer visibility
        function toggleAnswer() {
            const isHidden = answerEl.style.display === "none" || answerEl.style.display === "";
            answerEl.style.display = isHidden ? "block" : "none";
            cardContainer.setAttribute("aria-expanded", isHidden ? "true" : "false");
        }

        // Navigation logic with wrap-around
        function nextCard() {
            currentIndex = (currentIndex + 1) % cards.length;
            updateDisplay();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            updateDisplay();
        }

        function firstCard() {
            currentIndex = 0;
            updateDisplay();
        }

        function lastCard() {
            currentIndex = cards.length - 1;
            updateDisplay();
        }

        // Button Click Event Listeners
        showAnswerBtn.addEventListener("click", toggleAnswer);
        nextBtn.addEventListener("click", nextCard);
        prevBtn.addEventListener("click", prevCard);
        cardContainer.addEventListener("click", toggleAnswer);

        // Keyboard Event Listener (Supports cross-browser key standards)
        document.addEventListener("keydown", (event) => {
            // Standard arrow & space navigation
            if (event.key === "ArrowRight" || event.key === "Right") {
                nextCard();
            } else if (event.key === "ArrowLeft" || event.key === "Left") {
                prevCard();
            } else if (event.key === " " || event.key === "Spacebar") {
                event.preventDefault(); // Prevent page scrolling
                toggleAnswer();
            } 
            // Beyond requirements: Home and End key shortcuts
            else if (event.key === "Home") {
                event.preventDefault();
                firstCard();
            } else if (event.key === "End") {
                event.preventDefault();
                lastCard();
            }
        });

        // Initialize on load
        updateDisplay();
    </script>
</body>
</html>
