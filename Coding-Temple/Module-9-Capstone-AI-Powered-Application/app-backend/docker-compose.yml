version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/app.db
      - SECRET_KEY=your_development_secret_key
    volumes:
      - .:/app
      - sqlite_data:/app/data

volumes:
  sqlite_data: